{% extends 'base.html' %}

{% block title %}出错了 - BirdVision{% endblock %}

{% block content %}
<div class="text-center" style="padding: 3rem 0;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--bv-primary);">{{ error_code }}</div>
    <h4 class="mt-3">{{ error_title }}</h4>
    <p class="text-muted">{{ error_message }}</p>
    <a href="/" class="btn btn-success mt-3">
        <i class="fa-solid fa-house me-1"></i>返回首页
    </a>
</div>
{% endblock %}
