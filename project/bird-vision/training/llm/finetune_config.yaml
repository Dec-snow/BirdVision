### model
model_name_or_path: /path/to/deepseek-llm  # 替换为实际模型路径

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16

### dataset
dataset: bird_knowledge
template: default
cutoff_len: 1024
max_samples: 1000
overwrite_output_dir: true

### output
output_dir: ../../models/llm/bird-expert

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true

### eval
val_size: 0.1
eval_strategy: steps
eval_steps: 50

### logging
logging_steps: 10
save_steps: 100
save_total_limit: 3